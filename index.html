<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Nhẫn Giới Hải Vân</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Bố cục: khung game ngang cố định 1280×720, co giãn vừa màn hình; giao diện gỗ viền vàng kiểu game mobile */
:root{
 --wood:#7a4520;--wood2:#9a5c2a;--woodD:#3b1e0c;--gold:#f6c94a;--goldD:#a86d10;--parch:#f6e6bf;--inkD:#2a1406;
 --sea:#0f2f52;--red:#d83c2c;--blue:#2f7fd8;--green:#3aa84a;--purple:#8a4ad0;
 --ff:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;--fd:'Bungee','Baloo 2',system-ui,sans-serif;
 color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 40%,#18385e,#071423 70%);color:#fff;font-family:var(--ff);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:var(--ff);cursor:pointer;color:#fff;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#game{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;overflow:hidden;border-radius:14px;background:#123;box-shadow:0 20px 60px #000a}
#scr,#battle{position:absolute;inset:0}
#battle{z-index:10;background:#000}
.stk{text-shadow:0 2px 0 #3a1a00,2px 0 0 #3a1a00,-2px 0 0 #3a1a00,0 -2px 0 #3a1a00,2px 2px 0 #3a1a00,-2px 2px 0 #3a1a00,2px -2px 0 #3a1a00,-2px -2px 0 #3a1a00}
/* khung gỗ */
.wood{background:repeating-linear-gradient(90deg,#0000 0 38px,#00000014 38px 40px),repeating-linear-gradient(0deg,#ffffff08 0 3px,#0000 3px 9px),linear-gradient(180deg,var(--wood2),var(--wood));border:4px solid var(--woodD);border-radius:18px;box-shadow:inset 0 0 0 3px #d39a42,inset 0 0 0 6px #5a2e10,0 8px 0 #0006}
.parch{background:linear-gradient(180deg,#fbeecb,#ead39c);color:var(--inkD);border:3px solid #8a5a22;border-radius:12px;box-shadow:inset 0 0 18px #b8864a66}
/* nút nổi khối */
.gb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:4px 22px;font-weight:800;font-size:22px;border-radius:14px;border:3px solid #6b3608;
 background:linear-gradient(180deg,#fff2a8 0%,#ffd04a 30%,#f5a21e 70%,#e57f0e 100%);box-shadow:0 5px 0 #6b3608,inset 0 2px 0 #fff9,inset 0 -3px 0 #c66a08;transition:transform .08s,box-shadow .08s;
 text-shadow:0 2px 0 #7a3a00,2px 0 0 #7a3a00,-2px 0 0 #7a3a00,0 -2px 0 #7a3a00,1px 1px 0 #7a3a00,-1px 1px 0 #7a3a00}
.gb:active{transform:translateY(4px);box-shadow:0 1px 0 #6b3608,inset 0 2px 0 #fff9}
.gb:disabled{filter:grayscale(.85) brightness(.8);cursor:not-allowed}
.gb.red{background:linear-gradient(180deg,#ffb0a0,#f05a40 35%,#c4301e);border-color:#5a1206;box-shadow:0 5px 0 #5a1206,inset 0 2px 0 #fff8;text-shadow:0 2px 0 #5a1206,2px 0 0 #5a1206,-2px 0 0 #5a1206,0 -2px 0 #5a1206}
.gb.blue{background:linear-gradient(180deg,#bfe4ff,#4aa2f0 35%,#1f64c0);border-color:#0b2a5a;box-shadow:0 5px 0 #0b2a5a,inset 0 2px 0 #fff8;text-shadow:0 2px 0 #0b2a5a,2px 0 0 #0b2a5a,-2px 0 0 #0b2a5a,0 -2px 0 #0b2a5a}
.gb.green{background:linear-gradient(180deg,#d6ffb0,#5cc84a 35%,#2a8a2a);border-color:#123a10;box-shadow:0 5px 0 #123a10,inset 0 2px 0 #fff8;text-shadow:0 2px 0 #123a10,2px 0 0 #123a10,-2px 0 0 #123a10,0 -2px 0 #123a10}
.gb.sm{min-height:36px;font-size:17px;padding:2px 14px;border-radius:11px}
.gb svg{width:30px;height:30px;filter:drop-shadow(0 2px 0 #0007)}
/* thẻ tab */
.tab{min-width:118px;height:48px;border-radius:14px;font-weight:800;font-size:21px;background:linear-gradient(180deg,#b06a30,#7a4018);border:3px solid #3b1e0c;box-shadow:inset 0 0 0 2px #d39a42,0 3px 0 #0006}
.tab.on{background:linear-gradient(180deg,#ffd24a,#d08a12);box-shadow:0 0 0 4px #ffef6a,0 0 18px #ffe24a,inset 0 0 0 2px #fff6}
/* nút quay lại tròn */
.backb{position:absolute;left:18px;top:14px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe9a0,#f0a828 60%,#b86a10);border:4px solid #4a2408;box-shadow:0 5px 0 #4a2408,inset 0 2px 0 #fff8;z-index:5}
.backb svg{width:40px;height:40px;fill:#fff;stroke:#5a2a00;stroke-width:2.5;paint-order:stroke}
/* tiền tệ */
.curs{position:absolute;top:16px;right:18px;display:flex;gap:16px;z-index:5}
.cur{position:relative;height:44px;min-width:180px;padding:0 16px 0 52px;display:flex;align-items:center;justify-content:flex-end;font-weight:800;font-size:22px;border-radius:12px;background:linear-gradient(180deg,#5a3418,#3b1e0c);border:3px solid #c8903a;box-shadow:0 3px 0 #0007;font-variant-numeric:tabular-nums}
.cur i{position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:54px;height:54px}
.cur .plus{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;background:linear-gradient(#7de05a,#2a9a2a);border:2px solid #0e3a0e;font-weight:800;font-size:20px;line-height:22px}
/* thẻ tướng */
.hc{position:relative;width:104px;height:104px;border-radius:12px;border:4px solid #3a8ad8;overflow:hidden;background:#1a2a44;box-shadow:0 4px 0 #0008;flex:none}
.hc canvas{position:absolute;inset:0;width:100%;height:100%}
.hc.r-S{border-color:#e8463a;box-shadow:0 4px 0 #0008,0 0 0 2px #ffd24a}
.hc.r-A{border-color:#a05ae0}
.hc.r-SS{border-color:#ff8a2a;box-shadow:0 4px 0 #0008,0 0 0 2px #ffe066,0 0 14px #ff8a2a}
.hc.r-SSS{border-color:#ffe066;animation:sss 2.4s linear infinite}
@keyframes sss{0%{box-shadow:0 4px 0 #0008,0 0 0 2px #e8463a,0 0 18px #ffd24a}33%{box-shadow:0 4px 0 #0008,0 0 0 2px #a05ae0,0 0 18px #6ad0ff}66%{box-shadow:0 4px 0 #0008,0 0 0 2px #3aa84a,0 0 18px #ff8a2a}100%{box-shadow:0 4px 0 #0008,0 0 0 2px #e8463a,0 0 18px #ffd24a}}
.hc.r-SS .rk,.hc.r-SSS .rk{font-size:16px;color:#fff3a0;text-shadow:0 2px 0 #7a1a00,2px 0 0 #7a1a00,-2px 0 0 #7a1a00,0 -2px 0 #7a1a00}
.hc.r-SSS .rk{background:linear-gradient(90deg,#ff5a5a,#ffe066,#6ad0ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.2px #4a1a00;text-shadow:none}
.hc.r-UR{border-color:#ff4ad8;animation:urg 1.6s linear infinite}
@keyframes urg{0%{box-shadow:0 4px 0 #0008,0 0 0 3px #ff4ad8,0 0 22px #ffe066}25%{box-shadow:0 4px 0 #0008,0 0 0 3px #ffe066,0 0 22px #6aff9a}50%{box-shadow:0 4px 0 #0008,0 0 0 3px #6ad0ff,0 0 22px #c86aff}75%{box-shadow:0 4px 0 #0008,0 0 0 3px #c86aff,0 0 22px #ff5a5a}100%{box-shadow:0 4px 0 #0008,0 0 0 3px #ff4ad8,0 0 22px #ffe066}}
.hc.r-UR .rk{font-size:18px;background:linear-gradient(90deg,#ff4ad8,#ffe066,#6aff9a,#6ad0ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.3px #3a0030;text-shadow:none}
.hc.r-B{border-color:#3a8ad8}
.hc .rk{position:absolute;right:3px;top:0;font-family:var(--fd);font-size:20px;color:#ffe066;text-shadow:0 2px 0 #7a1a00,2px 0 0 #7a1a00,-2px 0 0 #7a1a00,0 -2px 0 #7a1a00}
.hc.r-A .rk{color:#e8c8ff;text-shadow:0 2px 0 #3a0a6a,2px 0 0 #3a0a6a,-2px 0 0 #3a0a6a,0 -2px 0 #3a0a6a}
.hc.r-B .rk{color:#c8e8ff;text-shadow:0 2px 0 #0a2a5a,2px 0 0 #0a2a5a,-2px 0 0 #0a2a5a,0 -2px 0 #0a2a5a}
.hc .lv{position:absolute;left:0;bottom:16px;min-width:30px;padding:0 4px;height:24px;border-radius:0 8px 8px 0;background:#000b;font-weight:800;font-size:17px;line-height:25px}
.hc .st{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(0deg,#000c,#0000);font-size:13px;letter-spacing:-1px;color:#ffd24a;text-align:center;line-height:18px;text-shadow:0 1px 0 #000}
.hc .el{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 0 #000}
.hc .ck{display:none;position:absolute;inset:0;background:#0006}
.hc .ck svg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:64px;height:64px}
.hc.in .ck{display:block}
.hc.lock{filter:grayscale(1) brightness(.55)}
.hcw{display:flex;flex-direction:column;align-items:center;gap:2px}
.hcw .nm{font-weight:700;font-size:15px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sảnh */
.plate{position:absolute;left:16px;top:12px;display:flex;align-items:center;gap:10px;z-index:5}
.ava{width:84px;height:84px;border-radius:50%;overflow:hidden;border:4px solid #ffd24a;box-shadow:0 0 0 3px #5a2a00,0 4px 0 #0008;background:#234}
.ava canvas{width:100%;height:100%}
.pinfo{background:linear-gradient(90deg,#000a,#0000);padding:4px 30px 6px 12px;border-radius:10px}
.pinfo b{display:block;font-size:22px;line-height:1.1}
.pinfo span{font-size:16px;color:#ffe08a;font-weight:700}
.side-btns{position:absolute;right:18px;top:96px;display:flex;flex-direction:column;gap:12px;z-index:4}
.rb{display:flex;flex-direction:column;align-items:center;gap:0;width:96px}
.rb .ic{position:relative;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffe9a8,#e8a43a 55%,#a5600e);border:4px solid #4a2408;box-shadow:0 4px 0 #4a2408,inset 0 2px 0 #fffa;display:flex;align-items:center;justify-content:center}
.rb .ic svg{width:44px;height:44px}
.rb b{font-size:19px;margin-top:-6px}
.rb .dot{position:absolute;right:-2px;top:-2px;width:20px;height:20px;border-radius:50%;background:#f03a2a;border:3px solid #fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.bottombar{position:absolute;left:0;right:0;bottom:0;height:118px;display:flex;align-items:flex-end;gap:10px;padding:0 20px 12px;background:linear-gradient(0deg,#1a0c04ee,#1a0c0400);z-index:4}
.bb{display:flex;flex-direction:column;align-items:center;width:112px}
.bb .ic{width:84px;height:76px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#b06a30,#7a4018);border:4px solid #3b1e0c;box-shadow:inset 0 0 0 2px #d39a42,0 4px 0 #0008;transition:transform .12s}
.bb:hover .ic{transform:translateY(-4px)}
.bb .ic svg{width:48px;height:48px}
.bb b{font-size:19px;margin-top:-4px}
.gostage{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:4px}
.gostage .gb{min-height:76px;font-size:32px;padding:4px 30px;border-radius:20px}
.gostage small{font-size:16px;font-weight:700;color:#ffe08a}
.hint{position:absolute;left:20px;bottom:128px;max-width:430px;font-size:15px;line-height:1.35;background:#000a;border:2px solid #c8903a;border-radius:12px;padding:8px 12px;z-index:3}
/* cửa sổ */
.panel{position:absolute}
.title-rib{position:absolute;left:50%;transform:translateX(-50%);top:-26px;min-width:300px;height:56px;padding:0 40px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:28px;background:linear-gradient(180deg,#e8463a,#a8201a);border:4px solid #4a0a04;border-radius:12px;box-shadow:0 4px 0 #0008,inset 0 2px 0 #fff6;white-space:nowrap}
.title-rib:before,.title-rib:after{content:"";position:absolute;top:10px;width:30px;height:40px;background:#a8201a;border:4px solid #4a0a04;z-index:-1}
.title-rib:before{left:-24px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.title-rib:after{right:-24px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.grid{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;overflow-y:auto;padding:4px 6px 10px}
.grid::-webkit-scrollbar{width:10px}.grid::-webkit-scrollbar-thumb{background:#d39a42;border-radius:5px}
.modal{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30}
.toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);background:#000d;border:3px solid #ffd24a;padding:8px 22px;border-radius:14px;z-index:60;font-size:20px;font-weight:700;white-space:nowrap}
.rotate{position:fixed;inset:auto 0 0 0;padding:8px;text-align:center;font:600 14px var(--ff);background:#000c;color:#ffe08a;z-index:99}
@media (orientation:landscape),(min-width:900px){.rotate{display:none}}
@keyframes popin{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:popin .45s cubic-bezier(.2,.9,.3,1.35) both}
.rise{animation:rise .35s ease-out both}
/* trận đấu */
#cv{position:absolute;inset:0;width:100%;height:100%}
.bt{position:absolute;top:10px;width:460px;z-index:3}
.bt.l{left:14px}.bt.r{right:14px;text-align:right}
.bt .tn{font-size:22px;font-weight:800}
.cbar{position:relative;height:22px;margin-top:2px;border-radius:12px;background:#0009;border:3px solid #c8903a;overflow:hidden}
.cbar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(180deg,#a8e4ff,#2a8ae8 60%,#1a5ab0);transition:width .3s}
.bt.r .cbar i{left:auto;right:0;background:linear-gradient(180deg,#ffb8a8,#e8463a 60%,#a01a10)}
.cbar span{position:absolute;inset:0;text-align:center;font-weight:800;font-size:15px;line-height:17px}
.bt .sp{font-weight:700;font-size:16px;margin-top:2px;color:#ffe08a}
.rnd{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:120px;height:66px;border-radius:0 0 30px 30px;background:linear-gradient(180deg,#5a3418,#3b1e0c);border:3px solid #c8903a;border-top:0;text-align:center;z-index:3;font-weight:800;font-size:28px;line-height:44px}
.rnd small{display:block;font-size:13px;line-height:8px;color:#ffe08a}
.pcards{position:absolute;left:12px;bottom:10px;display:flex;gap:8px;z-index:3}
.pc{position:relative;width:98px;height:116px;border-radius:12px;border:4px solid #3a8ad8;background:#1a2a44;overflow:hidden;box-shadow:0 4px 0 #0008;transition:transform .15s}
.pc canvas{position:absolute;left:0;top:0;width:100%;height:90px}
.pc .hp{position:absolute;left:4px;right:4px;bottom:22px;height:8px;border-radius:4px;background:#000a;overflow:hidden}
.pc .hp i{display:block;height:100%;background:linear-gradient(#7affb0,#1aa860)}
.pc .cost{position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,#2a5ab0,#14306a);font-weight:800;font-size:15px;line-height:22px}
.pc .ord{position:absolute;right:4px;top:0;font-family:var(--fd);font-size:30px;color:#ffe066}
.pc .nm{position:absolute;left:4px;top:2px;font-weight:800;font-size:14px}
.pc.ready{border-color:#6ad0ff;box-shadow:0 4px 0 #0008,0 0 16px #6ad0ff;transform:translateY(-6px)}
.pc.q{border-color:#ffd24a;box-shadow:0 4px 0 #0008,0 0 22px #ffd24a;transform:translateY(-10px)}
.pc.dead{filter:grayscale(1) brightness(.4)}
.bctrl{position:absolute;right:14px;bottom:12px;display:flex;flex-direction:column;gap:12px;z-index:3}
.bctrl .gb{min-width:150px}
#prompt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:#000c;border:3px solid #ffd24a;border-radius:16px;padding:10px 16px;font-size:19px;font-weight:700;z-index:4}
#cutin{position:absolute;left:0;right:0;top:30%;height:34%;pointer-events:none;overflow:hidden;z-index:5}
#cutin .band{position:absolute;inset:0;background:linear-gradient(90deg,#0000,#000d 18%,#000d 82%,#0000);display:flex;align-items:center;justify-content:center;gap:20px;animation:band .95s ease both;border-top:4px solid #ffd24a;border-bottom:4px solid #ffd24a}
#cutin canvas{height:130%;aspect-ratio:1}
#cutin .t{font-family:var(--fd);font-size:54px;color:#ffe066;text-shadow:0 4px 0 #7a2a00,3px 0 0 #7a2a00,-3px 0 0 #7a2a00}
#cutin .t small{display:block;font-family:var(--ff);font-size:22px;color:#fff;text-shadow:0 2px 0 #000}
@keyframes band{0%{transform:translateX(-70%) skewX(-14deg);opacity:0}16%{transform:none;opacity:1}84%{transform:none;opacity:1}100%{transform:translateX(70%) skewX(14deg);opacity:0}}
#result{position:absolute;inset:0;z-index:20}
@media (prefers-reduced-motion:reduce){.pop,.rise,#cutin .band,.rb .dot{animation:none}}
</style>
<div id="game">
 <div id="scr"></div>
 <div id="battle" hidden>
  <canvas id="cv" width="1280" height="720"></canvas>
  <div class="bt l"><div class="tn stk" id="tnL"></div><div class="cbar"><i id="chL"></i><span class="stk" id="chLt"></span></div><div class="sp stk" id="spL"></div></div>
  <div class="rnd stk" id="rnd"></div>
  <div class="bt r"><div class="tn stk" id="tnR"></div><div class="cbar"><i id="chR"></i><span class="stk" id="chRt"></span></div><div class="sp stk" id="spR"></div></div>
  <div class="pcards" id="pcards"></div>
  <div class="bctrl"><button class="gb sm blue" id="bAuto">Tự động</button><button class="gb sm" id="bSpd">×1</button><button class="gb sm green" id="bWin" hidden>Thắng ngay</button><button class="gb sm red" id="bQuit">Rút lui</button></div>
  <div id="cutin"></div>
  <div id="prompt" hidden><span class="stk" id="ptext"></span><button class="gb sm red" id="go">Xuất chiêu</button></div>
  <div id="result" hidden></div>
 </div>
</div>
<div class="rotate">Xoay ngang điện thoại để chơi thoải mái hơn</div>

<script>
"use strict";


/* =========================================================
   DỮ LIỆU — toàn bộ nhân vật, làng, chiêu thức là sáng tác nguyên bản
   ========================================================= */
const EL={kim:{n:'Kim',c:'#d9dee8'},moc:{n:'Mộc',c:'#5fd068'},thuy:{n:'Thủy',c:'#4aa8ff'},hoa:{n:'Hỏa',c:'#ff7a3a'},tho:{n:'Thổ',c:'#d0a060'}};
// tương khắc ngũ hành: Kim khắc Mộc, Mộc khắc Thổ, Thổ khắc Thủy, Thủy khắc Hỏa, Hỏa khắc Kim
const KHAC={kim:'moc',moc:'tho',tho:'thuy',thuy:'hoa',hoa:'kim'};
const VIL={
 sontra:{n:'Làng Sơn Trà',c:'#3c8d4f',sym:'peak'},
 nguhanh:{n:'Làng Ngũ Hành',c:'#9b8f7a',sym:'five'},
 mykhe:{n:'Làng Mỹ Khê',c:'#2f7fc8',sym:'wave'},
 ronglua:{n:'Làng Rồng Lửa',c:'#c8432f',sym:'dragon'},
 haivan:{n:'Làng Hải Vân',c:'#7b6fd0',sym:'cloud'},
 hactrieu:{n:'Hắc Triều',c:'#2a2033',sym:'tide'},
 thanthoai:{n:'Thần Thoại Việt',c:'#c89a28',sym:'sun'}
};
const ST={tung:'Hất Tung',nga:'Quật Ngã',lui:'Đẩy Lùi'};
const ROLE={cong:'Công',thu:'Thủ',ho:'Hỗ trợ',am:'Ám sát'};
// look: [tóc kiểu, màu tóc, da, áo, khăn, vũ khí, mặt nạ]
const H=[
 {id:'long',n:'Trần Long Diệm',t:'Hỏa Long Cầu Rồng',v:'ronglua',el:'hoa',r:'cong',rar:'S',hp:3300,atk:420,def:120,spd:96,

/* ---------- chỉ số ---------- */
function stat(h,lv,star){const f=(1+0.085*(lv-1))*(1+0.14*(star-1));return{hp:Math.round(h.hp*f),atk:Math.round(h.atk*f),def:Math.round(h.def*f),spd:Math.round(h.spd*(1+0.01*(lv-1))+(star-1)*2)};}
function powerOf(h,lv,star){const s=stat(h,lv,star);return Math.round(s.hp/6+s.atk*2.2+s.def*1.6+s.spd*4);}
function teamPower(){return S.team.filter(Boolean).reduce((a,id)=>{const o=S.owned[id];return a+(o?powerOf(HB[id],o.lv,o.star):0);},0);}

/* =========================================================
   VẼ NHẪN GIẢ (thủ tục, phong cách chibi)
   ========================================================= */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function limb(c,x,y,len,ang,w,col){c.save();c.translate(x,y);c.rotate(ang);c.fillStyle=col;rr(c,-w/2,0,w,len,w/2);c.fill();c.restore();}
function sym(c,kind,col){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2;c.lineCap='round';c.beginPath();
 if(kind==='peak'){c.moveTo(-7,4);c.lineTo(-2,-4);c.lineTo(1,0);c.lineTo(4,-5);c.lineTo(8,4);c.stroke();}
 else if(kind==='five'){for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;c.moveTo(Math.cos(a)*5+1.4,Math.sin(a)*5);c.arc(Math.cos(a)*5,Math.sin(a)*5,1.4,0,7);}c.fill();}
 else if(kind==='wave'){c.moveTo(-8,1);c.quadraticCurveTo(-4,-5,0,1);c.quadraticCurveTo(4,7,8,1);c.stroke();}
 else if(kind==='dragon'){c.moveTo(-8,3);c.bezierCurveTo(-4,-6,0,6,4,-3);c.lineTo(8,-4);c.stroke();}
 else if(kind==='cloud'){c.arc(-3,1,3.5,Math.PI,0);c.arc(3,1,3.5,Math.PI,0);c.stroke();}
 else if(kind==='lantern'){c.beginPath();c.ellipse(0,1,4.5,6,0,0,7);c.fill();c.fillRect(-2,-7,4,2);c.fillRect(-2,6,4,2);}
 else if(kind==='sun'){for(let i=0;i<8;i++){const a=i*Math.PI/4;c.moveTo(Math.cos(a)*3,Math.sin(a)*3);c.lineTo(Math.cos(a)*7,Math.sin(a)*7);}c.stroke();c.beginPath();c.arc(0,0,2.5,0,7);c.fill();}
 else{c.arc(0,0,5,0,Math.PI*1.6);c.stroke();}}

function pull(n,mode){
 if(mode==='ve')S.tickets-=n;else if(mode==='ngoc')S.gems-=n===10?2700:300;
 const rs=(S.cfg?.rateS??6)/100,ng=mode==='ngoc';const pSSS=ng?0.015:0.005,pSS=pSSS+(ng?0.05:0.02),pS=pSS+(ng?Math.min(0.6,rs*2):rs),pA=Math.min(0.97,pS+(ng?0.38:0.30));const res=[];let gotA=false;
 for(let i=0;i<n;i++){S.pity++;S.pity2=(S.pity2||0)+1;let r=Math.random(),rar=r<pSSS?'SSS':r<pSS?'SS':r<pS?'S':r<pA?'A':'B';
  if(S.pity2>=120&&rar!=='SSS')rar='SS';else if(S.pity>=40&&['A','B'].includes(rar))rar='S';if(n===10&&i===9&&!gotA&&rar==='B')rar='A';
  if(rar!=='B')gotA=true;if(['S','SS','SSS'].includes(rar))S.pity=0;if(rar==='SS'||rar==='SSS')S.pity2=0;
  const c=POOL.filter(h=>h.rar===rar);const h=c[Math.floor(Math.random()*c.length)];
  if(S.owned[h.id]){const sh={UR:60,SSS:40,SS:30,S:20,A:12,B:8}[rar];S.owned[h.id].sh+=sh;res.push({id:h.id,dup:1,sh});}
  else{S.owned[h.id]={lv:1,star:1,sh:0};res.push({id:h.id});}}
 save();return res;}

S.inv=S.inv||[];S.mats=Object.assign({dp:0},S.mats||{});S.pets=S.pets||{vooc:{lv:1}};S.pet=S.pet||'vooc';

const eqStat=e=>EQS.find(s=>s[0]===e.s)[2];

 const x=Math.random()+level*0.6;const r=x>1.45?3:x>1.05?2:x>0.6?1:0;return newEq(EQS[Math.floor(Math.random()*4)][0],r);}
function eqOwner(u){for(const id in S.owned){const eq=S.owned[id].eq;for(const k in eq)if(eq[k]===u)return id;}return null;}

function fullStat(id){const h=HB[id],o=S.owned[id];if(!o)return stat(h,1,1);const s=stat(h,o.lv,o.star);const f=1+0.12*(o.br||0);
 const r={hp:Math.round(s.hp*f),atk:Math.round(s.atk*f),def:Math.round(s.def*f),spd:s.spd+(o.br||0)*3};
 return eqApply(r,o);}

/* ---------- âm thanh (tổng hợp bằng Web Audio, không dùng tệp nhạc) ---------- */
const AU=(()=>{let ctx=null,master=null,musicG=null,on=true,mood=null,timer=0,step=0;
 try{on=localStorage.getItem('nghv_snd')!=='0';}catch(e){}
 const SCALE=[0,2,5,7,9,12,14,17,19,21];// ngũ cung
 function init(){if(ctx)return;try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}master=ctx.createGain();master.gain.value=on?0.7:0;master.connect(ctx.destination);musicG=ctx.createGain();musicG.gain.value=0.22;musicG.connect(master);}
 function tone(f,t0,dur,type,vol,dest,slide){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.3,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+0.05);}
 function noise(t0,dur,vol,fType,f0,f1){const len=Math.max(1,ctx.sampleRate*dur|0),b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type=fType||'bandpass';f.frequency.setValueAtTime(f0||1200,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=ctx.createGain();g.gain.setValueAtTime(vol||0.3,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t0);}
 // tiếng đàn gảy kiểu đàn tranh: sóng tam giác + rung nhẹ + tắt nhanh
 function pluck(f,t0,vol){const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.01;
  const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=5.5;lg.gain.value=f*0.006;lfo.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+1.2);
  const g2=ctx.createGain();g2.gain.value=0.25;o2.connect(g2);g2.connect(g);o.connect(g);g.connect(musicG);[o,o2,lfo].forEach(x=>{x.start(t0);x.stop(t0+1.3);});}
 function tick(){if(!ctx||!mood)return;const bpm=mood==='battle'?132:84,spb=60/bpm/2,base=mood==='battle'?196:174.6;const t=ctx.currentTime+0.05;
  const bar=Math.floor(step/8),pos=step%8;
  if(pos===0||pos===4){tone(base/2*Math.pow(2,[0,5,7,3][bar%4]/12),t,spb*3.6,'sine',0.22,musicG);}
  if(mood==='battle'){if(pos%2===0)noise(t,0.12,pos===0?0.5:0.25,'lowpass',180,60);if(pos%2===1)noise(t,0.05,0.12,'highpass',6000);}
  if(Math.random()<(mood==='battle'?0.75:0.55)){const deg=SCALE[(Math.floor(Math.sin(step*0.7+bar)*3+4+Math.random()*3))%SCALE.length];pluck(base*Math.pow(2,deg/12),t,mood==='battle'?0.18:0.14);}
  step++;timer=setTimeout(tick,spb*1000);}
 return{
  unlock(){init();if(ctx&&ctx.state==='suspended')ctx.resume();},
  get on(){return on;},
  toggle(){on=!on;try{localStorage.setItem('nghv_snd',on?'1':'0');}catch(e){}if(master)master.gain.value=on?0.7:0;return on;},
  music(m){if(!ctx||mood===m)return;mood=m;clearTimeout(timer);step=0;if(m)tick();},
  click(){if(!ctx)return;tone(880,ctx.currentTime,0.06,'square',0.06);},
  slash(){if(!ctx)return;noise(ctx.currentTime,0.16,0.35,'bandpass',4000,900);},
  hit(crit){if(!ctx)return;const t=ctx.currentTime;tone(crit?140:110,t,0.18,'sine',0.5,null,50);noise(t,0.08,crit?0.4:0.25,'lowpass',2000);if(crit)tone(1600,t,0.12,'square',0.08);},
  ult(){if(!ctx)return;const t=ctx.currentTime;tone(220,t,0.7,'sawtooth',0.12,null,880);noise(t,0.6,0.25,'bandpass',300,3000);},
  boom(){if(!ctx)return;const t=ctx.currentTime;tone(80,t,0.6,'sine',0.6,null,30);noise(t,0.5,0.45,'lowpass',900,100);},
  coin(){if(!ctx)return;const t=ctx.currentTime;tone(1318,t,0.12,'square',0.08);tone(1760,t+0.08,0.2,'square',0.08);},
  chest(r){if(!ctx)return;const t=ctx.currentTime;[0,4,7,12,16,19,24].slice(0,3+r).forEach((s,i)=>pluck(392*Math.pow(2,s/12),t+i*0.09,0.3));},
  win(){if(!ctx)return;const t=ctx.currentTime;[0,5,7,12].forEach((s,i)=>pluck(392*Math.pow(2,s/12),t+i*0.14,0.35));},
  lose(){if(!ctx)return;const t=ctx.currentTime;[12,7,5,0].forEach((s,i)=>pluck(262*Math.pow(2,s/12),t+i*0.2,0.3));}};})();

   const up=m.querySelector('#ttUp');if(up)up.onclick=()=>{o.sh-=N.sh;S.mats.th-=N.th;o.star++;save();AU.chest(4);for(const k in PCACHE)if(k.startsWith(id))delete PCACHE[k];draw(`Thăng Tinh thành công: ${o.star}★!`);};}
  else if(tab==='tp'){const eq=btOf(id);const free=S.bt.filter(b=>!btOwner(b.u)).sort((a,b)=>b.r-a.r||a.k.localeCompare(b.k));
   B0.innerHTML=`<b style="font-size:18px">Tâm Pháp: 3 ô bí tịch</b><div>Mỗi tướng gắn tối đa 3 bí tịch, <b>không trùng loại</b>. 4 phẩm Lục → Lam → Tím → Cam; gộp 3 cuốn cùng loại, cùng phẩm thành 1 cuốn phẩm cao hơn. Bí tịch rơi ở phó bản <b>Tàng Kinh Các</b>.</div>
    <div style="display:flex;gap:10px;margin:8px 0">${[0,1,2].map(i=>{const b=eq[i];return`<div style="flex:1;border:3px dashed ${b?BTR[b.r][1]:'#b8a080'};border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;min-height:56px;background:#fff8">${b?`${btIcon(b,44)}<div style="flex:1;font-size:13px"><b>${BTK[b.k][0]}</b><br><span style="color:${BTR[b.r][1]};font-weight:800">${BTR[b.r][0]}</span> · ${BTK[b.k][1]} +${btVal(b)}${BTK[b.k][3]}</div><button class="gb sm" data-off="${b.u}">Gỡ</button>`:'<i style="opacity:.7">Ô trống</i>'}</div>`;}).join('')}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><b>Kho bí tịch (${free.length} chưa dùng)</b><button class="gb sm red" id="btM">Gộp tự động</button><button class="gb sm green" id="btQ">Gắn tốt nhất</button></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${free.map(b=>{const dup=eq.some(x=>x.k===b.k);return`<div style="display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:10px;background:#fff8;border:2px solid ${BTR[b.r][1]}">${btIcon(b,34)}<div style="flex:1;font-size:12px;line-height:1.2"><b>${BTK[b.k][0]}</b><br>${BTK[b.k][1]} +${btVal(b)}${BTK[b.k][3]}</div><button class="gb sm" style="padding:2px 8px;font-size:12px" data-on="${b.u}" ${eq.length>=3||dup?'disabled':''}>Gắn</button></div>`;}).join('')||'<i>Chưa có bí tịch – đánh phó bản Tàng Kinh Các.</i>'}</div>`;
   B0.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>{o.tp=o.tp.filter(u=>u!==+b.dataset.off);save();draw();});
   B0.querySelectorAll('[data-on]').forEach(b=>b.onclick=()=>{o.tp=btOf(id).map(x=>x.u);o.tp.push(+b.dataset.on);save();draw();});
   m.querySelector('#btM').onclick=()=>{let n=0,again=true;while(again){again=false;for(const k in BTK)for(let r=0;r<3;r++){const g=S.bt.filter(b=>b.k===k&&b.r===r&&!btOwner(b.u));if(g.length>=3){const use=g.slice(0,3);S.bt=S.bt.filter(b=>!use.includes(b));newBt(k,r+1);n++;again=true;}}}save();draw(n?`Gộp được ${n} cuốn phẩm cao hơn`:'Không có 3 cuốn cùng loại, cùng phẩm');};
   m.querySelector('#btQ').onclick=()=>{const w=ROLEW[h.r];const score=b=>btVal(b)*(b.k in w?w[b.k]*(b.k==='spd'?1.6:1):b.k==='bk'?(h.r==='ho'?0.3:1.1):b.k==='no'?1.4:0.9);
    const pool=S.bt.filter(b=>{const ow=btOwner(b.u);return!ow||ow===id;}).sort((a,b)=>score(b)-score(a));const pick=[];for(const b of pool){if(pick.length>=3)break;if(!pick.some(x=>x.k===b.k))pick.push(b);}o.tp=pick.map(b=>b.u);save();draw('Đã gắn 3 bí tịch phù hợp nhất');};}
  else{const ok=o.lv>=1000&&o.cs<CSMAX;
   B0.innerHTML=`<b style="font-size:18px">Chuyển Sinh (tối đa ${CSMAX} lần)</b><div>Khi tướng đạt <b>cấp 1000</b>, có thể Chuyển Sinh: tướng về <b>cấp 1</b> nhưng <b>giữ nguyên</b> đột phá, sao, thức tỉnh, Khai Mạch, trang bị, Thần Binh, bí tịch; nhận vĩnh viễn <b>+${CSB}% máu, công, thủ</b> mỗi lần và <b>+300 Tinh Hồn</b>. Lên lại cấp 1000 để Chuyển Sinh lần tiếp theo.</div>
    <div style="display:flex;gap:8px;margin:10px 0">${Array.from({length:CSMAX},(_,i)=>`<div style="flex:1;text-align:center;padding:8px;border-radius:12px;border:3px solid ${o.cs>i?'#c8209a':'#b8a080'};background:${o.cs>i?'linear-gradient(135deg,#ffe0f4,#ffd24a)':'#fff8'}"><b>Lần ${i+1}</b><br><small>+${CSB*(i+1)}% tổng</small><br>${o.cs>i?'✔':''}</div>`).join('')}</div>
    <div>Hiện tại: <b>Chuyển Sinh ${o.cs}/${CSMAX}</b> · thưởng vĩnh viễn +${CSB*o.cs}% máu, công, thủ.</div>
    <div style="margin:6px 0">Điều kiện: cấp <b style="color:${o.lv>=1000?'#2a8a3a':'#c8201a'}">${o.lv}/1000</b>${o.cs>=CSMAX?' · <b>Đã tối đa</b>':''}</div>
    <div style="font-size:13px;opacity:.85">Lưu ý: lên lại cấp tốn nhiều xu – hãy chuẩn bị trước. Cấp giảm nên lực chiến tạm thời giảm.</div>
    <button class="gb red" id="csGo" style="margin-top:8px" ${ok?'':'disabled'}>Chuyển Sinh lần ${o.cs+1}</button><div id="csConf"></div>`;
   const g=m.querySelector('#csGo');g.onclick=()=>{m.querySelector('#csConf').innerHTML=`<div style="margin-top:8px;padding:8px;border-radius:10px;background:#ff3a3a22;border:2px solid #c8201a">Xác nhận đưa ${h.n} về cấp 1? <button class="gb sm red" id="csY">Đồng ý</button> <button class="gb sm" id="csN">Huỷ</button></div>`;
    m.querySelector('#csN').onclick=()=>draw();m.querySelector('#csY').onclick=()=>{o.cs++;o.lv=1;S.mats.th+=300;save();AU.chest(5);for(const k in PCACHE)if(k.startsWith(id))delete PCACHE[k];draw(`Chuyển Sinh lần ${o.cs} thành công! +${CSB}% vĩnh viễn, +300 Tinh Hồn`);};};}};draw();}
// nút trong bảng chi tiết + sửa hiển thị sao
const _hd16=heroDetail;
heroDetail=function(id){_hd16(id);const o=S.owned[id];if(!o)return;const ms=GAME.querySelectorAll('.modal'),m=ms[ms.length-1];const btns=m&&m.querySelector('#dBtns');if(!btns)return;
 const b=document.createElement('button');b.className='gb sm';b.style.background='linear-gradient(180deg,#fff0c0,#ffb020 45%,#c8601a)';b.textContent='Bồi dưỡng';b.onclick=()=>nurture(id);btns.prepend(b);
 const us=m.querySelector('#us');if(us&&o.star>=5){us.disabled=false;us.textContent=o.star>=10?'10★ tối đa':'Thăng Tinh ▶';us.onclick=()=>nurture(id,'tt');}};
// ---------- nguồn: phó bản Tàng Kinh Các + Tinh Hồn ----------
if(!DG.find(d=>d.k==='bt'))DG.push({k:'bt',n:'Tàng Kinh Các',d:'Bí tịch, Tinh Hồn',th:'haivan'});
const _dgR16=dgReward;dgReward=function(k,t,RW){if(k!=='bt')return _dgR16(k,t,RW);const f=t+1;return{bt:1+Math.floor(t/3),th:Math.round(8*Math.pow(f,1.3)*RW)};};
const _dgT16=dgTxt;dgTxt=function(r){const a=_dgT16(r);return[a,r.bt?r.bt+' bí tịch':'',r.th?r.th+' Tinh Hồn':''].filter(Boolean).join(', ');};
const _dgG16=dgGive;dgGive=function(k,t,RW){if(k!=='bt')return _dgG16(k,t,RW);const r=dgReward(k,t,RW);S.mats.th+=r.th;const got=[];for(let i=0;i<r.bt;i++)got.push(dropBt(t));S.medal=(S.medal||0)+3;
 return `${r.th} Tinh Hồn, ${got.map(b=>BTR[b.r][0]+' '+BTK[b.k][0]).join(', ')}`;};

go('hub');
</script>
